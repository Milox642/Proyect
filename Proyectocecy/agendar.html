<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Cita · Tecno High</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    if (!localStorage.getItem('tecnoHighLoggedIn')) {
      window.location.replace('sesion.html');
    }
  </script>
</head>
<body>
  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Agendar Cita</h1>
      <p>Reserva tu espacio en el taller para que atendamos tu equipo.</p>
      <a href="index.html" class="hero-button">Volver al Inicio</a>
    </div>
  </header>

  <main>
    <section class="panel panel--intro">
      <div class="panel-grid" style="grid-template-columns: 1fr; gap: 40px; max-width: 650px; margin: 0 auto;">
        <div>
          <h2>Solicita tu Cita</h2>
          <p>Completa el formulario para agendar tu visita al taller. Te confirmaremos la fecha y hora disponible.</p>
        </div>
        <div>
          <form action="procesar_cita.php" method="post" class="appointment-form" id="appointmentForm">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

            <label for="telefono">Teléfono de contacto</label>
            <input type="tel" id="telefono" name="telefono" placeholder="5512345678" required>

            <label for="dispositivo">Tipo de Dispositivo</label>
            <select id="dispositivo" name="dispositivo" required>
              <option value="" disabled selected>Selecciona tu equipo...</option>
              <option value="Smartphone Android">Smartphone Android</option>
              <option value="iPhone">iPhone</option>
              <option value="Tablet / iPad">Tablet / iPad</option>
              <option value="Laptop / Macbook">Laptop / Macbook</option>
              <option value="PC de Escritorio">PC de Escritorio</option>
            </select>

            <label for="servicio">Servicio Solicitado</label>
            <select id="servicio" name="servicio" required>
              <option value="" disabled selected>Selecciona el servicio...</option>
              <option value="Cambio de Pantalla / Cristal">Cambio de Pantalla / Cristal</option>
              <option value="Reemplazo de Batería">Reemplazo de Batería</option>
              <option value="Reparación de Puerto de Carga">Reparación de Puerto de Carga</option>
              <option value="Limpieza / Daño por Agua">Limpieza / Daño por Agua</option>
              <option value="Soporte de Software / Virus">Soporte de Software / Virus</option>
              <option value="Diagnóstico General">Diagnóstico General</option>
            </select>

            <label for="fecha">Fecha Tentativa</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora Sugerida</label>
            <input type="time" id="hora" name="hora" required>

            <label for="descripcion">Descripción del Problema</label>
            <textarea id="descripcion" name="descripcion" rows="4" placeholder="Cuéntanos qué le ocurre a tu dispositivo..." required></textarea>

            <button class="hero-button" type="submit" style="margin-top: 20px; width: 100%; border: none; cursor: pointer;">Enviar Solicitud</button>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
